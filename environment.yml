# SRARec environment: Linux (x86_64), WSL, macOS Intel and macOS Apple Silicon (via Rosetta 2).
#
# Only top-level dependencies are listed; the solver picks the right builds for each platform.
#
#   Linux / WSL / Intel Mac:
#     conda env create -f environment.yml          (or: micromamba env create -f environment.yml)
#
#   Apple Silicon (M1/M2/M3...): ngsngs and smalt (needed by SHIVER) have no osx-arm64 build,
#   so resolve the environment for osx-64 (runs through Rosetta 2):
#     CONDA_SUBDIR=osx-64 conda env create -f environment.yml
#     CONDA_SUBDIR=osx-64 micromamba env create -f environment.yml
#   then pin the environment to that platform:
#     conda activate srarec && conda config --env --set subdir osx-64
#
# Use flexible channel priority if the solver reports conflicts:
#     conda config --set channel_priority flexible
name: srarec
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  # External tools called by SRARec1.3.py
  - sra-tools
  - entrez-direct
  - cutadapt
  - bwa
  - minimap2
  - samtools
  - bcftools
  - picard
  - spades
  - bbmap
  - shiver
  - ngsngs
  # Python libraries (SRARec1.3.py and generate_graphs.py)
  - pysam
  - tqdm
  - biopython
  - pandas
  - numpy
  - matplotlib
  - plotly
  - python-kaleido
